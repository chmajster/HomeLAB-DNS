name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y bind9 bind9-utils dnsutils shellcheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Test
        run: ./testing.sh
