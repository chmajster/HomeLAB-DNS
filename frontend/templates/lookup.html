{% extends "base.html" %}{% block title %}DNS Lookup · ChrisLab DNS{% endblock %}{% block content %}
<h1 class="h3">DNS Lookup</h1><div class="card mt-3"><div class="card-body"><form id="lookup-form"><div class="row g-3"><div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" value="{{ lookup_name or '' }}" placeholder="google.com" required></div><div class="col-md-3"><label class="form-label">Type</label><select class="form-select" name="type">{% for t in ['A','AAAA','MX','TXT','NS','PTR','CNAME','SOA','SRV','CAA','ANY'] %}<option{% if lookup_type == t %} selected{% endif %}>{{ t }}</option>{% endfor %}</select></div><div class="col-md-3"><label class="form-label">DNS server (optional)</label><input class="form-control" name="server" value="{{ lookup_server or '' }}" placeholder="1.1.1.1"></div><div class="col-12"><button class="btn btn-primary">Lookup</button></div></div></form><pre class="mt-4 result-box d-none" id="lookup-result"></pre></div></div>
{% endblock %}
