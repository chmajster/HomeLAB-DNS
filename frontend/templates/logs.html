{% extends "base.html" %}{% block title %}Logs · ChrisLab DNS{% endblock %}{% block content %}
<h1 class="h3">BIND9 Logs</h1><div class="card mt-3"><div class="card-body"><form id="logs-form"><div class="row g-2"><div class="col-md-3"><label class="form-label">Latest lines</label><input class="form-control" type="number" name="lines" value="200" min="1" max="2000"></div><div class="col-md-3"><label class="form-label">Last minutes</label><input class="form-control" type="number" name="since_minutes" value="60" min="1" max="10080"></div><div class="col-md-3"><label class="form-label">Minimum level</label><select class="form-select" name="level">{% for x in ['debug','info','notice','warning','err','crit'] %}<option>{{ x }}</option>{% endfor %}</select></div><div class="col-md-3 d-flex align-items-end"><button class="btn btn-primary w-100">Refresh</button></div><div class="col-12"><input id="logs-search" class="form-control" placeholder="Search loaded logs"></div></div></form><pre id="logs-result" class="result-box mt-3">Loading…</pre><button class="btn btn-outline-secondary btn-sm" id="download-logs">Download loaded logs</button></div></div>
{% endblock %}
